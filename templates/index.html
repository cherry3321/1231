<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaMSG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-bg">
    <div class="auth-orb orb1"></div>
    <div class="auth-orb orb2"></div>
    <div class="auth-orb orb3"></div>
  </div>
  <div class="auth-container">
    <div class="auth-logo">
      <div class="logo-icon">N</div>
      <span class="logo-text">NovaMSG</span>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Войти</button>
      <button class="auth-tab" data-tab="register">Регистрация</button>
    </div>

    <div class="auth-form" id="login-form">
      <div class="input-group">
        <label>Имя пользователя</label>
        <input type="text" id="login-username" placeholder="@username" autocomplete="username">
      </div>
      <div class="input-group">
        <label>Пароль</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="auth-error" id="login-error"></div>
      <button class="btn-primary" id="login-btn">Войти</button>
    </div>

    <div class="auth-form hidden" id="register-form">
      <div class="input-group">
        <label>Имя пользователя</label>
        <input type="text" id="reg-username" placeholder="@username" autocomplete="username">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="input-group">
        <label>Пароль</label>
        <input type="password" id="reg-password" placeholder="минимум 6 символов" autocomplete="new-password">
      </div>
      <div class="auth-error" id="reg-error"></div>
      <button class="btn-primary" id="register-btn">Создать аккаунт</button>
    </div>
  </div>
</div>

<!-- App Screen -->
<div id="app-screen" class="app-screen hidden">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon sm">N</div>
        <span>NovaMSG</span>
      </div>
      <div class="sidebar-actions">
        <button class="icon-btn" id="new-chat-btn" title="Новый чат">
          <svg viewBox="0 0 24 24"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg>
        </button>
        <button class="icon-btn" id="new-group-btn" title="Новая группа">
          <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        </button>
      </div>
    </div>

    <div class="search-bar">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="chat-search" placeholder="Поиск чатов...">
    </div>

    <div class="chats-list" id="chats-list">
      <div class="chats-loading">
        <div class="spinner"></div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-widget" id="my-user-widget">
        <div class="avatar sm" id="my-avatar">?</div>
        <div class="user-widget-info">
          <span class="username" id="my-username">...</span>
          <span class="status online">● В сети</span>
        </div>
      </div>
      <button class="icon-btn" id="settings-btn" title="Настройки">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="chat-main">
    <!-- Welcome Screen -->
    <div class="welcome-screen" id="welcome-screen">
      <div class="welcome-icon">💬</div>
      <h2>Выберите чат</h2>
      <p>Или начните новый разговор</p>
    </div>

    <!-- Chat View -->
    <div class="chat-view hidden" id="chat-view">
      <div class="chat-header">
        <div class="chat-header-info">
          <div class="avatar md" id="chat-avatar">?</div>
          <div>
            <div class="chat-header-name" id="chat-name">Chat</div>
            <div class="chat-header-sub" id="chat-sub">...</div>
          </div>
        </div>
        <div class="chat-header-actions">
          <button class="icon-btn" id="chat-info-btn" title="Информация">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          </button>
        </div>
      </div>

      <div class="messages-container" id="messages-container">
        <div class="messages-list" id="messages-list"></div>
        <div class="typing-indicator hidden" id="typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="message-input-area">
        <div class="file-preview hidden" id="file-preview">
          <div class="file-preview-info">
            <span id="file-preview-name"></span>
            <span id="file-preview-size"></span>
          </div>
          <button class="remove-file-btn" id="remove-file-btn">✕</button>
        </div>
        <div class="input-row">
          <button class="icon-btn attach-btn" id="attach-btn" title="Прикрепить файл">
            <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
          </button>
          <input type="file" id="file-input" style="display:none" multiple>
          <div class="message-input-wrapper">
            <textarea id="message-input" placeholder="Написать сообщение..." rows="1"></textarea>
          </div>
          <button class="send-btn" id="send-btn">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

</div>

<!-- Modal: New Direct Chat -->
<div class="modal-overlay hidden" id="modal-new-chat">
  <div class="modal">
    <div class="modal-header">
      <h3>Новый чат</h3>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="input-group">
        <label>Найти пользователя</label>
        <input type="text" id="search-user-input" placeholder="Введите имя пользователя...">
      </div>
      <div class="user-search-results" id="user-search-results"></div>
    </div>
  </div>
</div>

<!-- Modal: New Group -->
<div class="modal-overlay hidden" id="modal-new-group">
  <div class="modal">
    <div class="modal-header">
      <h3>Создать группу</h3>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="input-group">
        <label>Название группы</label>
        <input type="text" id="group-name-input" placeholder="Название...">
      </div>
      <div class="input-group">
        <label>Описание (необязательно)</label>
        <input type="text" id="group-desc-input" placeholder="О чём эта группа...">
      </div>
      <div class="input-group">
        <label>Участники (через запятую)</label>
        <input type="text" id="group-members-input" placeholder="username1, username2...">
      </div>
      <div class="modal-error" id="group-error"></div>
      <button class="btn-primary" id="create-group-btn">Создать</button>
    </div>
  </div>
</div>

<!-- Modal: Chat Info -->
<div class="modal-overlay hidden" id="modal-chat-info">
  <div class="modal">
    <div class="modal-header">
      <h3>Информация</h3>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body" id="chat-info-body"></div>
  </div>
</div>

<!-- Settings Panel -->
<div class="settings-panel hidden" id="settings-panel">
  <div class="settings-header">
    <button class="icon-btn back-btn" id="settings-back">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <h2>Настройки</h2>
  </div>
  <div class="settings-body">
    <div class="settings-avatar-section">
      <div class="avatar xl" id="settings-avatar">?</div>
      <div class="avatar-color-picker">
        <label>Цвет аватара</label>
        <div class="color-swatches" id="color-swatches"></div>
      </div>
    </div>

    <div class="settings-section">
      <h4>Профиль</h4>
      <div class="input-group">
        <label>Имя пользователя</label>
        <input type="text" id="settings-username">
      </div>
      <div class="input-group">
        <label>О себе</label>
        <textarea id="settings-bio" placeholder="Расскажите о себе..."></textarea>
      </div>
    </div>

    <div class="settings-section">
      <h4>Безопасность</h4>
      <div class="input-group">
        <label>Новый пароль</label>
        <input type="password" id="settings-password" placeholder="Оставьте пустым, чтобы не менять">
      </div>
    </div>

    <div class="settings-msg hidden" id="settings-msg"></div>
    <button class="btn-primary" id="save-settings-btn">Сохранить</button>
    <button class="btn-secondary" id="logout-btn">Выйти</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
